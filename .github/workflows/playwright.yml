name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]   # ⬅️ change based on number of shards

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build Docker image
        run: docker build -t pw-tests .

      - name: Run Playwright Shard ${{ matrix.shard }}
        run: |
          mkdir -p blob-reports/shard-${{ matrix.shard }}
          npx playwright test \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            --reporter=blob \
            --output=blob-reports/shard-${{ matrix.shard }}
        continue-on-error: true   # ⬅️ tests may fail, but report should still upload

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-blob
          path: blob-reports/shard-${{ matrix.shard }}
          retention-days: 7

  merge-report:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all shard reports
        uses: actions/download-artifact@v4
        with:
          path: blob-reports

      - name: Merge shard reports → HTML
        if: always()
        run: |
          npx playwright merge-reports \
            --reporter=html \
            blob-reports
          mv playwright-report merged-report

      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-playwright-report
          path: merged-report
          retention-days: 30
