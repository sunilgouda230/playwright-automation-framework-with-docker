name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ======================================================
  # 🧪 SHARDED TEST EXECUTION
  # ======================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]        # shard index
        totalShards: [3]        # total shards

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # -------------------------------------
      # 🐳 Build Docker image
      # -------------------------------------
      - name: Build Docker image
        run: docker build -t pw-tests .

      # -------------------------------------
      # 🧪 Run Playwright Shard
      # -------------------------------------
      - name: Run Playwright Shard ${{ matrix.shard }}
        run: |
          mkdir -p blob-reports/shard-${{ matrix.shard }}
          npx playwright test \
            --shard=${{ matrix.shard }}/${{ matrix.totalShards }} \
            --reporter=blob \
            --output=blob-reports/shard-${{ matrix.shard }}
        continue-on-error: true

      # -------------------------------------
      # 📤 Debug: list report files
      # -------------------------------------
      - name: List shard report folder
        run: ls -R blob-reports/shard-${{ matrix.shard }}

      # -------------------------------------
      # 📤 Upload Shard Report
      # -------------------------------------
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-blob
          path: blob-reports/shard-${{ matrix.shard }}
          retention-days: 7

  # ======================================================
  # 🧩 MERGE SHARD REPORTS
  # ======================================================
  merge-report:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      # -------------------------------------
      # ⬇ Download all shard artifacts
      # -------------------------------------
      - name: Download all shard reports
        uses: actions/download-artifact@v4
        with:
          path: blob-reports

      - name: Install dependencies
        run: npm ci

      # -------------------------------------
      # 🔗 Merge shard reports → HTML
      # -------------------------------------
      - name: Merge shard reports → HTML
        run: |
          ls -R blob-reports   # debug: verify all shards are present
          npx playwright merge-reports blob-reports
          mv playwright-report merged-report

      # -------------------------------------
      # 📤 Upload final consolidated report
      # -------------------------------------
      - name: Upload Consolidated Report
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-playwright-report
          path: merged-report
          retention-days: 30
