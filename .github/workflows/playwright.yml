name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # -------------------------------
    # 🟦 Run shards in parallel
    # -------------------------------
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4]   # 👈 adjust number of shards here
    env:
      TOTAL_SHARDS: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # -------------------------------------
      # 🐳 Build Docker image
      # -------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application docker image
        run: |
          docker build -t my-app:ci .

      # -------------------------------------
      # 🚀 Run container for testing
      # -------------------------------------
      - name: Start application container
        run: |
          docker run -d \
            --name my-app-container \
            -p 3000:3000 \
            my-app:ci

      # -------------------------------------
      # 📦 Install test dependencies
      # -------------------------------------
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # -------------------------------------
      # 🧪 Run Playwright Tests (Sharded)
      # -------------------------------------
      - name: Run Playwright tests (shard ${{ matrix.shard_index }})
        run: |
          npx playwright test --shard=${{ matrix.shard_index }}/${{ env.TOTAL_SHARDS }}

      # -------------------------------------
      # 📤 Upload report per shard
      # -------------------------------------
      - name: Upload Playwright Report (Shard ${{ matrix.shard_index }})
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard_index }}
          path: playwright-report/
          retention-days: 30

      # -------------------------------------
      # 🧹 Cleanup container
      # -------------------------------------
      - name: Stop & remove container
        if: always()
        run: |
          docker stop my-app-container || true
          docker rm my-app-container || true
