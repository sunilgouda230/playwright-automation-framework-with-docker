name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ======================================================
  # 🧪 SHARDED TEST EXECUTION
  # ======================================================
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4]   # 👈 adjust shard count here

    env:
      TOTAL_SHARDS: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # -------------------------------------
      # 🐳 Build Docker image
      # -------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application docker image
        run: docker build -t my-app:ci .

      # -------------------------------------
      # 🚀 Start container
      # -------------------------------------
      - name: Start application container
        run: |
          docker run -d \
            --name my-app-container \
            -p 3000:3000 \
            my-app:ci

      # -------------------------------------
      # 📦 Install test deps
      # -------------------------------------
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # -------------------------------------
      # 🧪 Run Playwright Tests (Shard)
      # -------------------------------------
      - name: Run Playwright tests (Shard ${{ matrix.shard_index }})
        run: |
          npx playwright test --shard=${{ matrix.shard_index }}/${{ env.TOTAL_SHARDS }}

      # -------------------------------------
      # 📤 Upload shard report — EVEN IF FAILED
      # -------------------------------------
      - name: Upload Shard Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard_index }}
          path: playwright-report/
          retention-days: 7

      # -------------------------------------
      # 🧹 Cleanup container
      # -------------------------------------
      - name: Stop & remove container
        if: always()
        run: |
          docker stop my-app-container || true
          docker rm my-app-container || true


  # ======================================================
  # 🧩 MERGE REPORTS (ALWAYS RUNS)
  # ======================================================
  merge-report:
    runs-on: ubuntu-latest
    needs: test

    # 👇 ensures merge runs regardless of failures
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # -------------------------------------
      # ⬇ Download ALL shard artifacts
      # -------------------------------------
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          path: shard-reports

      # -------------------------------------
      # 📦 Install deps for merge tool
      # -------------------------------------
      - name: Install dependencies
        run: npm ci

      # -------------------------------------
      # 🔗 Merge reports into one
      # -------------------------------------
      - name: Merge Playwright Reports
        run: |
          npx playwright merge-reports \
            --reporter=html \
            shard-reports/shard-*

          # rename to a friendly folder name
          mv playwright-report merged-report


      # -------------------------------------
      # 📤 Upload Final Consolidated Report
      # -------------------------------------
      - name: Upload Consolidated Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-consolidated-report
          path: merged-report/
          retention-days: 30
