name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3, 4]
    env:
      TOTAL_SHARDS: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application docker image
        run: docker build -t my-app:ci .

      - name: Start application container
        run: |
          docker run -d \
            --name my-app-container \
            -p 3000:3000 \
            my-app:ci

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (shard ${{ matrix.shard_index }})
        run: |
          npx playwright test --shard=${{ matrix.shard_index }}/${{ env.TOTAL_SHARDS }}

      - name: Upload shard report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: shard-${{ matrix.shard_index }}
          path: playwright-report/
          retention-days: 7

      - name: Stop & remove container
        if: always()
        run: |
          docker stop my-app-container || true
          docker rm my-app-container || true


  # ---------------------------------------------------------
  # 🧩 MERGE REPORTS AFTER ALL SHARDS COMPLETE
  # ---------------------------------------------------------
  merge-report:
    runs-on: ubuntu-latest
    needs: test   # waits for all shards to finish

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          path: shard-reports

      - name: Install dependencies (for playwright merge tool)
        run: npm ci

      - name: Merge Playwright reports
        run: |
          npx playwright merge-reports \
            --report-dir merged-report \
            shard-reports/shard-*

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-consolidated-report
          path: merged-report/
          retention-days: 30
