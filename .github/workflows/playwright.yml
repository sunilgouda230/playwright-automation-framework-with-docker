name: Playwright Sharded Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build and Run Sharded Tests
      # This runs your custom script which handles Docker and Merging
      # We set CI=true so your playwright.config.json logic triggers
      run: node run-tests.js --shard=4
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL }} # If you use secrets

    - name: Upload Consolidated HTML Report
      if: always() # Upload even if tests failed
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30